<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">

    <!-- Restore the saved theme before first paint so a dark-mode visitor never
         sees a white flash. Kept inline and synchronous on purpose. -->
    <script>
      try {
        var t = localStorage.getItem('sk-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

{% seo %}
    {% include head-custom.html %}
  </head>

  <body>

    <!-- HEADER -->
    <header class="site-header">
      <div class="wrap">
        <span class="brand"><span class="sigil">~/</span>shaddy43<span class="caret">&#9613;</span></span>
        <div class="header-right">
          <nav class="nav" aria-label="Main">
            <a href="#whoami">Whoami</a>
            <a href="#posts">Posts</a>
            <a href="#repos">Projects</a>
            <a href="#certifications">Certs</a>
            <a href="https://github.com/shaddy43" target="_blank" rel="noopener">GitHub</a>
          </nav>
          <button class="theme-toggle" type="button" aria-label="Switch colour theme">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- HERO -->
    <div class="site-hero">
      <div class="wrap">
        <span class="eyebrow">Portfolio</span>
        <!-- The name and handle are already the first thing the whoami terminal
             prints, so the hero leads with the roles instead of repeating them. -->
        <h1>{{ site.description | default: site.github.project_tagline }}</h1>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="site-main">
      <div class="wrap">
        {{ content }}
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="wrap">
        <span>&copy; {{ site.time | date: '%Y' }} Shayan Ahmed Khan</span>
        <span>Built with <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a></span>
      </div>
    </footer>

    <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
  </body>
</html>
